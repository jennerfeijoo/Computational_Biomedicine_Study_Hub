name: Patch Socratic mentor typing

on:
  push:
    branches:
      - feature/socratic-ollama-mentor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/socratic-ollama-mentor

      - name: Apply typed QSettings conversion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/computational_biomedicine_study_hub/ui/widgets/floating_tutor_chat.py')
          text = path.read_text(encoding='utf-8')
          old = '''        raw = self._settings.value(key, default)
          try:
              value = int(raw)
          except (TypeError, ValueError):
              return default
          return value if value > 0 else default
          '''
          new = '''        raw = self._settings.value(key, default)
          if isinstance(raw, bool):
              return default
          try:
              value = int(str(raw))
          except ValueError:
              return default
          return value if value > 0 else default
          '''
          if old not in text:
              raise SystemExit('Expected QSettings conversion block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/computational_biomedicine_study_hub/ui/widgets/floating_tutor_chat.py
          git commit -m 'Fix typed mentor generation settings'
          git push origin HEAD:feature/socratic-ollama-mentor
