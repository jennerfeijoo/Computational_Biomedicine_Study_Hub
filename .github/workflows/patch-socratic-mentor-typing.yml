name: Patch Socratic mentor typing

on:
  push:
    branches:
      - feature/socratic-ollama-mentor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/socratic-ollama-mentor

      - name: Apply typed QSettings conversion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/computational_biomedicine_study_hub/ui/widgets/floating_tutor_chat.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('            value = int(raw)\n', '            value = int(str(raw))\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/computational_biomedicine_study_hub/ui/widgets/floating_tutor_chat.py
          git commit -m 'Fix typed mentor generation settings'
          git push origin HEAD:feature/socratic-ollama-mentor
