name: Branch autoformat

on:
  push:
    branches:
      - agent/bmb830-r-foundations-data-workflow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bmb830-r-foundations-data-workflow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff<1,>=0.5'
      - run: ruff check --fix .
      - run: ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply Ruff formatting'
          git push origin HEAD:agent/bmb830-r-foundations-data-workflow
