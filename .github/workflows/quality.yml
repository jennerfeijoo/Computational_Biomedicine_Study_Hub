name: Quality

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize-bmb831:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Format BMB831 increment
        run: |
          ruff format \
            src/computational_biomedicine_study_hub/content/bmb831/__init__.py \
            src/computational_biomedicine_study_hub/content/bmb831/module_04_multivariate_omics.py \
            src/computational_biomedicine_study_hub/content/bmb831/module_05_advanced_visualization.py \
            src/computational_biomedicine_study_hub/content/bmb831/official_coverage.py \
            tests/test_bmb831_core_modules.py \
            tests/test_bmb831_lazy_loading.py \
            tests/test_bmb831_official_coverage.py

      - name: Update README status
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacement = '''### BMB831 implementation in progress

          - **BMB831 — Biostatistics in R II**
            - 5 complete modules
            - reproducible relational and longitudinal workflows using Synthea as one bounded synthetic case
            - omics matrix contracts, metadata alignment, quality control, filtering, normalization, transformation, scaling, and batch-effect boundaries
            - differential modeling with estimands, design matrices, count-model reasoning, effect sizes, uncertainty, and Benjamini-Hochberg false-discovery control
            - multivariate omics analysis with PCA, distances, clustering, stability, batch interpretation, and leakage-safe supervised reduction
            - advanced visualization with figure contracts, MA and volcano reasoning, heatmaps, uncertainty, accessibility, and reproducible export
            - 80 stable objective-bank questions
            - ten editable deterministic base-R laboratories
            - local Synthea snapshot inspection and deterministic one-row-per-patient table derivation
            - fixed nine-module roadmap covering public transcriptomics and proteomics workflows, protein characterization, biological interpretation, publication appraisal, and the individual English report
            - conservative public audit: 3 covered, 10 partial, and 2 gaps

          Synthea does not define the BMB831 curriculum. It remains one synthetic clinical-data case for relational and longitudinal practice and is never described as real-patient or omics evidence. The remaining explicit gaps are computational protein characterization and the individual English report; real-data pipelines and biological interpretation remain partial.

          '''
          pattern = re.compile(
              r"### BMB831 implementation in progress\n.*?(?=### Registered first-semester courses)",
              re.DOTALL,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Could not replace the BMB831 README section")
          status_pattern = re.compile(
              r"BMB831 now contains three complete modules:.*?remain to be implemented\."
          )
          status_replacement = (
              "BMB831 now contains five complete modules covering the bounded Synthea case, omics "
              "quality control, differential modeling, multivariate analysis, and advanced "
              "visualization. Complete public transcriptomics and proteomics workflows, protein "
              "characterization, biological interpretation, publication appraisal, a versioned "
              "real-data project, and the individual English report workflow remain to be implemented."
          )
          text, count = status_pattern.subn(status_replacement, text, count=1)
          if count != 1:
              raise SystemExit("Could not replace the BMB831 development-status sentence")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit normalized increment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            src/computational_biomedicine_study_hub/content/bmb831/__init__.py \
            src/computational_biomedicine_study_hub/content/bmb831/module_04_multivariate_omics.py \
            src/computational_biomedicine_study_hub/content/bmb831/module_05_advanced_visualization.py \
            src/computational_biomedicine_study_hub/content/bmb831/official_coverage.py \
            tests/test_bmb831_core_modules.py \
            tests/test_bmb831_lazy_loading.py \
            tests/test_bmb831_official_coverage.py
          git diff --cached --quiet || git commit -m "Normalize BMB831 multivariate and visualization increment"
          git push origin HEAD:${{ github.head_ref }}
