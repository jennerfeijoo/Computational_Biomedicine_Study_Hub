name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  normalize-activity-types:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Replace unsupported activity names
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path("src/computational_biomedicine_study_hub/content/bmb831/module_02_omics_matrices_qc.py"),
              Path("src/computational_biomedicine_study_hub/content/bmb831/module_03_differential_modeling.py"),
          )
          replacements = {
              '"OPEN_RESPONSE"': '"SHORT_ANSWER"',
              '"CODE_READING"': '"CODE_TRACING"',
              '"ERROR_RECONSTRUCTION"': '"DEBUGGING"',
              '"STARTER_CODE"': '"CODE_COMPLETION"',
          }
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f"Expected token {old} not found in {path}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit normalized activity types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/computational_biomedicine_study_hub/content/bmb831/module_02_omics_matrices_qc.py \
            src/computational_biomedicine_study_hub/content/bmb831/module_03_differential_modeling.py
          git diff --cached --quiet || git commit -m "Use supported BMB831 activity types"
          git push origin HEAD:${{ github.head_ref }}
