name: Quality

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize-bmb831:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Format complete BMB831 increment
        run: |
          ruff format \
            src/computational_biomedicine_study_hub/content/bmb831/__init__.py \
            src/computational_biomedicine_study_hub/content/bmb831/module_06_public_omics_workflows.py \
            src/computational_biomedicine_study_hub/content/bmb831/module_07_protein_characterization.py \
            src/computational_biomedicine_study_hub/content/bmb831/module_08_biological_interpretation.py \
            src/computational_biomedicine_study_hub/content/bmb831/module_09_publication_report.py \
            src/computational_biomedicine_study_hub/content/bmb831/official_coverage.py \
            src/computational_biomedicine_study_hub/datasets/__init__.py \
            src/computational_biomedicine_study_hub/datasets/omics_registry.py \
            src/computational_biomedicine_study_hub/i18n/bmb831_report_copy.py \
            src/computational_biomedicine_study_hub/learning/bmb831_report.py \
            src/computational_biomedicine_study_hub/storage/bmb831_report_store.py \
            src/computational_biomedicine_study_hub/ui/pages/assessments_page.py \
            src/computational_biomedicine_study_hub/ui/pages/bmb831_report_page.py \
            tests/test_bmb831_core_modules.py \
            tests/test_bmb831_lazy_loading.py \
            tests/test_bmb831_official_coverage.py \
            tests/test_bmb831_report.py \
            tests/test_bmb831_report_ui.py \
            tests/test_omics_registry.py

      - name: Update README status
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacement = '''### BMB831 authored course complete

          - **BMB831 — Biostatistics in R II**
            - 9 complete trilingual modules
            - relational and longitudinal data engineering using Synthea as one bounded synthetic case
            - omics matrix quality control, normalization, differential modeling, multiplicity, multivariate analysis, and advanced visualization
            - versioned public transcriptomics and proteomics source contracts with snapshot and transition auditing
            - computational protein characterization using sequence, domain, annotation, experimental-structure, and predicted-structure evidence boundaries
            - biological interpretation through identifier mapping, universes, enrichment, pathways, networks, redundancy, and circularity checks
            - publication appraisal and a persistent ten-section individual English-report studio
            - 144 stable objective-bank questions
            - 18 editable deterministic base-R laboratories
            - public-source registry for Bioconductor airway and ProteomeXchange PXD000001 teaching workflows
            - conservative public audit: 14 covered, 1 partial attendance requirement, and 0 academic-content gaps

          Synthea does not define the BMB831 curriculum and is never described as real-patient or omics evidence. Public datasets are registered as identifiable sources rather than bundled as mutable remote content. The application is academically complete against the active public description, but it cannot certify the official 80% tutorial participation threshold, reproduce private itslearning exercises or grading rubrics, or assign an official grade.

          '''
          pattern = re.compile(
              r"### BMB831 implementation in progress\n.*?(?=### Registered first-semester courses)",
              re.DOTALL,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Could not replace the BMB831 README section")

          status_pattern = re.compile(
              r"BMB831 now contains five complete modules.*?remain to be implemented\."
          )
          status_replacement = (
              "BMB831 is authored-course complete with nine modules covering advanced omics analysis, "
              "public-source workflow contracts, protein characterization, biological interpretation, "
              "publication appraisal, and a persistent individual English-report studio. Only official "
              "attendance certification and equivalence with private itslearning materials remain outside "
              "the application's evidence model."
          )
          text, count = status_pattern.subn(status_replacement, text, count=1)
          if count != 1:
              raise SystemExit("Could not replace the BMB831 development-status sentence")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit normalized increment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src tests docs/bmb831-completion-roadmap.md
          git diff --cached --quiet || git commit -m "Normalize complete BMB831 course increment"
          git push origin HEAD:${{ github.head_ref }}
