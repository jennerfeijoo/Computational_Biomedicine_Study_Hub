name: Temporary BMB830 Model Diagnostics Lint Fix

on:
  push:
    branches:
      - agent/bmb830-model-diagnostics-review

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/bmb830-model-diagnostics-review
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix imports and formatting
        run: |
          python -m pip install 'ruff<1,>=0.5'
          ruff check --fix src/computational_biomedicine_study_hub/content/bmb830/__init__.py
          ruff format src/computational_biomedicine_study_hub/content/bmb830/__init__.py
      - name: Commit lint fix
        run: |
          if git diff --quiet; then
            echo 'No lint fix required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/computational_biomedicine_study_hub/content/bmb830/__init__.py
          git commit -m 'Fix BMB830 review import ordering'
          git push origin HEAD:agent/bmb830-model-diagnostics-review
