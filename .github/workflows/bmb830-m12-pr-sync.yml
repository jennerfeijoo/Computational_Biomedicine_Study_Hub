name: BMB830 module 12 PR sync

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/bmb830-individual-high-dimensional-case' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bmb830-individual-high-dimensional-case
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize catalog, audit, tests, and documentation
        run: python .github/tmp/bmb830-m12/finalize.py
      - name: Format and lint synchronized changes
        run: |
          python -m pip install 'ruff<1,>=0.5'
          ruff check --fix .
          ruff format .
      - name: Commit synchronized BMB830 case
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Register individual BMB830 high-dimensional biological case'
          git push origin HEAD
