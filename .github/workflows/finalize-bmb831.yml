name: Finalize BMB831 Branch

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Correct M07 expected result and README
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          module = Path("src/computational_biomedicine_study_hub/content/bmb831/module_07_protein_characterization.py")
          text = module.read_text(encoding="utf-8")
          text = text.replace(
              '"""best_start=4\nbest_score=3.00"""',
              '"""best_start=5\nbest_score=3.60"""',
          )
          text = text.replace(
              "La ventana AILM inicia en la posición cuatro y maximiza la escala ilustrativa; no confirma por sí sola una hélice transmembrana.",
              "La ventana ILMV inicia en la posición cinco y maximiza la escala ilustrativa; no confirma por sí sola una hélice transmembrana.",
          )
          text = text.replace(
              "The AILM window starts at position four and maximizes the illustrative scale; it does not by itself confirm a transmembrane helix.",
              "The ILMV window starts at position five and maximizes the illustrative scale; it does not by itself confirm a transmembrane helix.",
          )
          text = text.replace(
              "AILM-vinduet starter ved position fire og maksimerer den illustrative skala; det bekræfter ikke i sig selv en transmembranhelix.",
              "ILMV-vinduet starter ved position fem og maksimerer den illustrative skala; det bekræfter ikke i sig selv en transmembranhelix.",
          )
          module.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          replacement = '''### BMB831 authored course complete

          - **BMB831 — Biostatistics in R II**
            - 9 complete trilingual modules
            - relational and longitudinal data engineering using Synthea as one bounded synthetic case
            - omics matrix quality control, normalization, differential modeling, multiplicity, multivariate analysis, and advanced visualization
            - versioned public transcriptomics and proteomics source contracts with snapshot and transition auditing
            - computational protein characterization using sequence, domain, annotation, experimental-structure, and predicted-structure evidence boundaries
            - biological interpretation through identifier mapping, universes, enrichment, pathways, networks, redundancy, and circularity checks
            - publication appraisal and a persistent ten-section individual English-report studio
            - 144 stable objective-bank questions
            - 18 editable deterministic base-R laboratories
            - public-source registry for Bioconductor airway and ProteomeXchange PXD000001 teaching workflows
            - conservative public audit: 14 covered, 1 partial attendance requirement, and 0 academic-content gaps

          Synthea does not define the BMB831 curriculum and is never described as real-patient or omics evidence. Public datasets are registered as identifiable sources rather than bundled as mutable remote content. The application is academically complete against the active public description, but it cannot certify the official 80% tutorial participation threshold, reproduce private itslearning exercises or grading rubrics, or assign an official grade.

          '''
          pattern = re.compile(
              r"### BMB831 (?:implementation in progress|authored course complete)\n.*?(?=### Registered first-semester courses)",
              re.DOTALL,
          )
          content, count = pattern.subn(replacement, content, count=1)
          if count != 1:
              raise SystemExit("Could not normalize the BMB831 README section")

          status_patterns = (
              r"BMB831 now contains five complete modules.*?remain to be implemented\.",
              r"BMB831 is authored-course complete.*?evidence model\.",
          )
          status_replacement = (
              "BMB831 is authored-course complete with nine modules covering advanced omics analysis, "
              "public-source workflow contracts, protein characterization, biological interpretation, "
              "publication appraisal, and a persistent individual English-report studio. Only official "
              "attendance certification and equivalence with private itslearning materials remain outside "
              "the application's evidence model."
          )
          replaced = 0
          for status_pattern in status_patterns:
              content, n = re.subn(status_pattern, status_replacement, content, count=1)
              replaced += n
              if n:
                  break
          if replaced != 1:
              raise SystemExit("Could not normalize the BMB831 development-status sentence")
          readme.write_text(content, encoding="utf-8")
          PY

      - name: Format increment
        run: |
          ruff format README.md src tests docs || true
          ruff format src tests

      - name: Restore standard quality workflow and remove temporary workflows
        run: |
          cat > .github/workflows/quality.yml <<'YAML'
          name: Quality

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.11", "3.12"]

              env:
                QT_QPA_PLATFORM: offscreen

              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Install Qt runtime libraries
                  run: sudo apt-get update && sudo apt-get install --yes libegl1

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip

                - name: Install project and development dependencies
                  run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

                - name: Lint
                  run: ruff check .

                - name: Check formatting
                  run: ruff format --check .

                - name: Type check
                  run: mypy

                - name: Test
                  run: pytest
          YAML
          rm -f .github/workflows/finalize-bmb831.yml
          rm -f .github/workflows/restore-quality.yml

      - name: Commit final clean branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Finalize complete BMB831 course"
          git push origin HEAD:${{ github.head_ref }}
