name: Validate and Merge BMB831

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out BMB831 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Enforce clean workflow state
        run: |
          grep -q "contents: read" .github/workflows/quality.yml
          rm -f .github/workflows/finalize-bmb831.yml
          rm -f .github/workflows/restore-quality.yml

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate on Python 3.11
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy
          pytest | tee /tmp/pytest-311.txt

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate on Python 3.12
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy
          pytest | tee /tmp/pytest-312.txt

      - name: Record validated branch state
        id: validation
        run: |
          count311=$(grep -oE '[0-9]+ passed' /tmp/pytest-311.txt | tail -1 | cut -d' ' -f1)
          count312=$(grep -oE '[0-9]+ passed' /tmp/pytest-312.txt | tail -1 | cut -d' ' -f1)
          test -n "$count311"
          test -n "$count312"
          test "$count311" = "$count312"
          echo "test_count=$count311" >> "$GITHUB_OUTPUT"
          cat > docs/bmb831-validation.md <<EOF
          # BMB831 final validation

          The complete authored BMB831 course was validated before integration.

          - Python 3.11: passed
          - Python 3.12: passed
          - Ruff lint: passed
          - Ruff format: passed
          - mypy strict: passed
          - pytest and pytest-qt: ${count311} passed on each Python version
          - authored modules: 9
          - stable objective-bank items: 144
          - deterministic editable base-R laboratories: 18
          - persistent English report sections: 10
          - public coverage audit: 14 covered, 1 partial attendance requirement, 0 gaps

          The remaining partial requirement is institutional: the application cannot certify official tutorial attendance or reproduce private Itslearning exercises and grading rubrics.
          EOF

      - name: Remove one-shot workflow and commit validation record
        run: |
          rm .github/workflows/validate-merge-bmb831.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Record final BMB831 validation"
          git push origin HEAD:${{ github.head_ref }}

      - name: Update pull request validation summary
        run: |
          cat > /tmp/pr-body.md <<EOF
          ## Purpose

          Complete BMB831 as an authored course rather than extending the Synthea clinical case.

          ## Complete curriculum

          - M01: reproducible relational and longitudinal workflows
          - M02: omics matrices, QC, filtering, normalization, transformation, and scaling
          - M03: differential modeling, contrasts, effect sizes, uncertainty, and multiplicity
          - M04: multivariate analysis, PCA, clustering, stability, and leakage control
          - M05: advanced visualization, uncertainty, heatmaps, MA/volcano plots, and export
          - M06: versioned public transcriptomics and proteomics workflow contracts
          - M07: computational protein characterization
          - M08: biological interpretation, enrichment, pathways, networks, and circularity
          - M09: publication appraisal and the individual English report

          ## Application workflow

          - nine strict trilingual modules
          - 144 stable objective-bank questions
          - 18 deterministic editable base-R laboratories
          - public-source registry for Bioconductor airway and ProteomeXchange PXD000001
          - persistent ten-section English report studio with atomic local storage
          - third Assessments tab for BMB831
          - no official grade or private-rubric equivalence

          ## Conservative public coverage

          - 14 covered requirements
          - 1 partial institutional attendance requirement
          - 0 academic-content gaps

          ## Validation

          - Python 3.11: passed
          - Python 3.12: passed
          - Ruff lint and format: passed
          - mypy strict: passed
          - pytest and pytest-qt: ${{ steps.validation.outputs.test_count }} passed on each Python version
          EOF
          gh pr edit 65 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-body.md

      - name: Mark ready and merge validated BMB831 course
        run: |
          gh pr ready 65 --repo "$GITHUB_REPOSITORY"
          gh pr merge 65 --repo "$GITHUB_REPOSITORY" --merge \
            --subject "Merge complete BMB831 authored course" \
            --body "Integrate the nine-module BMB831 curriculum, public omics source contracts, protein characterization, biological interpretation, publication appraisal, and persistent individual English-report workflow after full Python 3.11/3.12 validation."
