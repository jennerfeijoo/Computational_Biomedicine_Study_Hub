name: Format DM857 foundations

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/dm857-book-grounded-foundations-02'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dm857-book-grounded-foundations-02
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.1"
      - run: >-
          ruff format
          src/computational_biomedicine_study_hub/content/dm857/book_grounded_foundations.py
          tests/test_dm857_book_grounded_foundations.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/computational_biomedicine_study_hub/content/dm857/book_grounded_foundations.py \
            tests/test_dm857_book_grounded_foundations.py
          git commit -m "Format DM857 book-grounded foundations"
          git push origin HEAD:agent/dm857-book-grounded-foundations-02
