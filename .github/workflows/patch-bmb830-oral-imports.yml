name: Patch BMB830 oral imports

on:
  push:
    branches:
      - feature/bmb830-socratic-oral-exam

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/bmb830-socratic-oral-exam

      - name: Break the oral integration import cycle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/computational_biomedicine_study_hub/ui/pages/bmb830_oral_exam_page.py')
          text = path.read_text(encoding='utf-8')
          old = '''from ...integrations import (
              DEFAULT_CHAT_MODEL,
              BMB830OralEvaluationResult,
              BMB830OralEvaluator,
              OllamaConfig,
          )
          '''
          new = '''from ...integrations import DEFAULT_CHAT_MODEL, OllamaConfig
          from ...integrations.bmb830_oral import (
              BMB830OralEvaluationResult,
              BMB830OralEvaluator,
          )
          '''
          if old not in text:
              raise SystemExit('Expected BMB830 oral integration import block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/computational_biomedicine_study_hub/ui/pages/bmb830_oral_exam_page.py
          git commit -m 'Import the BMB830 oral evaluator directly'
          git push origin HEAD:feature/bmb830-socratic-oral-exam
