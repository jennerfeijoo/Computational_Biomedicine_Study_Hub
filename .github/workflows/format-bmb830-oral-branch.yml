name: Format BMB830 oral branch

on:
  push:
    branches:
      - feature/bmb830-socratic-oral-exam

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/bmb830-socratic-oral-exam

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Ruff fixes and formatting
        run: |
          python -m pip install 'ruff==0.16.1'
          ruff check . --fix
          ruff format .

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Apply Ruff fixes to BMB830 oral simulator'
          git push origin HEAD:feature/bmb830-socratic-oral-exam
