name: Merge BMB831 Only If Validated

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-if-validated:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Require complete validation evidence
        run: |
          test -f docs/bmb831-validation.md
          grep -q "Python 3.11: passed" docs/bmb831-validation.md
          grep -q "Python 3.12: passed" docs/bmb831-validation.md
          grep -q "Ruff lint and format: passed" docs/bmb831-validation.md
          grep -q "mypy strict: passed" docs/bmb831-validation.md
          grep -Eq "pytest and pytest-qt: [0-9]+ passed on each Python version" docs/bmb831-validation.md
          grep -q "public coverage audit: 14 covered, 1 partial attendance requirement, 0 gaps" docs/bmb831-validation.md
          grep -q "contents: read" .github/workflows/quality.yml

      - name: Remove all temporary workflows
        run: |
          rm -f .github/workflows/finalize-bmb831.yml
          rm -f .github/workflows/restore-quality.yml
          rm -f .github/workflows/validate-merge-bmb831.yml
          rm -f .github/workflows/sequential-finalize-bmb831.yml
          rm .github/workflows/merge-if-bmb831-validated.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove temporary BMB831 workflows"
          git pull --rebase origin ${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}

      - name: Mark ready and merge
        run: |
          gh pr ready 65 --repo "$GITHUB_REPOSITORY" || true
          gh pr merge 65 --repo "$GITHUB_REPOSITORY" --merge \
            --subject "Merge complete BMB831 authored course" \
            --body "Integrate BMB831 after evidence-gated validation on Python 3.11 and 3.12."
