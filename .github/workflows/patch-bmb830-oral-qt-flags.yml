name: Patch BMB830 oral Qt flags

on:
  push:
    branches:
      - feature/bmb830-socratic-oral-exam

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/bmb830-socratic-oral-exam

      - name: Normalize Qt text-selection flags
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/computational_biomedicine_study_hub/ui/pages/bmb830_oral_exam_page.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    QSettings,\n    QThreadPool,\n',
              '    QSettings,\n    QThreadPool,\n    Qt,\n',
              1,
          )
          text = text.replace(
              'self._question.textInteractionFlags().TextSelectableByMouse',
              'Qt.TextInteractionFlag.TextSelectableByMouse',
          )
          text = text.replace(
              'self._feedback.textInteractionFlags().TextSelectableByMouse',
              'Qt.TextInteractionFlag.TextSelectableByMouse',
          )
          text = text.replace(
              'self._follow_up.textInteractionFlags().TextSelectableByMouse',
              'Qt.TextInteractionFlag.TextSelectableByMouse',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/computational_biomedicine_study_hub/ui/pages/bmb830_oral_exam_page.py
          git commit -m 'Use explicit Qt text interaction flags'
          git push origin HEAD:feature/bmb830-socratic-oral-exam
