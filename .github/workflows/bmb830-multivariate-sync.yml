name: BMB830 multivariate sync

on:
  push:
    branches:
      - agent/bmb830-intro-multivariate-individual

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bmb830-intro-multivariate-individual
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register module and update audit
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}: found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          init = Path("src/computational_biomedicine_study_hub/content/bmb830/__init__.py")
          replace_once(
              init,
              '''from .module_10_diagnostics_validation import (
              LOCALIZED_MODULE_10_DIAGNOSTICS_VALIDATION,
              LOCALIZED_OBJECTIVE_QUESTION_BANK_10,
              materialize_module_10_question_bank,
          )
          ''',
              '''from .module_10_diagnostics_validation import (
              LOCALIZED_MODULE_10_DIAGNOSTICS_VALIDATION,
              LOCALIZED_OBJECTIVE_QUESTION_BANK_10,
              materialize_module_10_question_bank,
          )
          from .module_11_intro_multivariate import (
              LOCALIZED_MODULE_11_INTRO_MULTIVARIATE,
              LOCALIZED_OBJECTIVE_QUESTION_BANK_11,
              materialize_module_11_question_bank,
          )
          ''',
          )
          replace_once(
              init,
              '''    LocalizedModuleBundle(
                  LOCALIZED_MODULE_10_DIAGNOSTICS_VALIDATION,
                  LOCALIZED_OBJECTIVE_QUESTION_BANK_10,
                  "1.0.0",
              ),
          )''',
              '''    LocalizedModuleBundle(
                  LOCALIZED_MODULE_10_DIAGNOSTICS_VALIDATION,
                  LOCALIZED_OBJECTIVE_QUESTION_BANK_10,
                  "1.0.0",
              ),
              LocalizedModuleBundle(
                  LOCALIZED_MODULE_11_INTRO_MULTIVARIATE,
                  LOCALIZED_OBJECTIVE_QUESTION_BANK_11,
                  "1.0.0",
              ),
          )''',
          )
          replace_once(
              init,
              'MODULE_10_DIAGNOSTICS_VALIDATION = BUNDLES[9].module\n',
              'MODULE_10_DIAGNOSTICS_VALIDATION = BUNDLES[9].module\nMODULE_11_INTRO_MULTIVARIATE = BUNDLES[10].module\n',
          )
          replace_once(
              init,
              'OBJECTIVE_QUESTION_BANK_10 = BUNDLES[9].objective_question_bank\n',
              'OBJECTIVE_QUESTION_BANK_10 = BUNDLES[9].objective_question_bank\nOBJECTIVE_QUESTION_BANK_11 = BUNDLES[10].objective_question_bank\n',
          )
          for old, new in (
              ('    "LOCALIZED_MODULE_10_DIAGNOSTICS_VALIDATION",\n', '    "LOCALIZED_MODULE_10_DIAGNOSTICS_VALIDATION",\n    "LOCALIZED_MODULE_11_INTRO_MULTIVARIATE",\n'),
              ('    "LOCALIZED_OBJECTIVE_QUESTION_BANK_10",\n', '    "LOCALIZED_OBJECTIVE_QUESTION_BANK_10",\n    "LOCALIZED_OBJECTIVE_QUESTION_BANK_11",\n'),
              ('    "MODULE_10_DIAGNOSTICS_VALIDATION",\n', '    "MODULE_10_DIAGNOSTICS_VALIDATION",\n    "MODULE_11_INTRO_MULTIVARIATE",\n'),
              ('    "OBJECTIVE_QUESTION_BANK_10",\n', '    "OBJECTIVE_QUESTION_BANK_10",\n    "OBJECTIVE_QUESTION_BANK_11",\n'),
              ('    "materialize_module_10_question_bank",\n', '    "materialize_module_10_question_bank",\n    "materialize_module_11_question_bank",\n'),
          ):
              replace_once(init, old, new)

          audit = Path("src/computational_biomedicine_study_hub/content/bmb830/official_coverage.py")
          replace_once(
              audit,
              '''    "bmb830.m09",
              "bmb830.m10",
          )

          OFFICIAL_BMB830_REQUIREMENTS''',
              '''    "bmb830.m09",
              "bmb830.m10",
              "bmb830.m11",
          )

          OFFICIAL_BMB830_REQUIREMENTS''',
          )
          replace_once(
              audit,
              '("bmb830.m01", "bmb830.m02", "bmb830.m06", "bmb830.m08", "bmb830.m10"),',
              '("bmb830.m01", "bmb830.m02", "bmb830.m06", "bmb830.m08", "bmb830.m10", "bmb830.m11"),',
          )
          replace_once(
              audit,
              '''    OfficialRequirement(
                  "bmb830.sdu.lo03",
                  OfficialRequirementKind.LEARNING_OUTCOME,
                  "Use standard algorithms for multi-variate analysis.",
                  (),
                  CoverageStatus.GAP,
                  "No completed BMB830 module yet teaches a standard multivariate algorithm.",
                  "Add scaling, distance, PCA, clustering, validation, and biological interpretation.",
              ),''',
              '''    OfficialRequirement(
                  "bmb830.sdu.lo03",
                  OfficialRequirementKind.LEARNING_OUTCOME,
                  "Use standard algorithms for multi-variate analysis.",
                  ("bmb830.m11",),
                  CoverageStatus.COVERED,
                  "The individual multivariate module teaches matrix orientation, centring, scaling, "
                  "Euclidean and profile-based distance reasoning, PCA, hierarchical clustering, "
                  "sensitivity analysis, leakage prevention, and biological interpretation.",
              ),''',
          )
          replace_once(
              audit,
              '("bmb830.m01", "bmb830.m02", "bmb830.m07", "bmb830.m09", "bmb830.m10"),',
              '("bmb830.m01", "bmb830.m02", "bmb830.m07", "bmb830.m09", "bmb830.m10", "bmb830.m11"),',
          )
          replace_once(
              audit,
              '("bmb830.m05", "bmb830.m06", "bmb830.m07", "bmb830.m08", "bmb830.m09", "bmb830.m10"),',
              '("bmb830.m05", "bmb830.m06", "bmb830.m07", "bmb830.m08", "bmb830.m09", "bmb830.m10", "bmb830.m11"),',
          )
          replace_once(
              audit,
              '("bmb830.m02", "bmb830.m07", "bmb830.m09", "bmb830.m10"),',
              '("bmb830.m02", "bmb830.m07", "bmb830.m09", "bmb830.m10", "bmb830.m11"),',
          )
          replace_once(
              audit,
              '''    OfficialRequirement(
                  "bmb830.sdu.ct06",
                  OfficialRequirementKind.CONTENT_TOPIC,
                  "Basic multi-variate analysis.",
                  (),
                  CoverageStatus.GAP,
                  "The current catalog stops at regression diagnostics and validation.",
                  "Implement scaling, PCA, distances, clustering, validation, and biological interpretation.",
              ),''',
              '''    OfficialRequirement(
                  "bmb830.sdu.ct06",
                  OfficialRequirementKind.CONTENT_TOPIC,
                  "Basic multi-variate analysis.",
                  ("bmb830.m11",),
                  CoverageStatus.COVERED,
                  "A complete individual module now covers preprocessing, distance, PCA, hierarchical "
                  "clustering, sensitivity, validation boundaries, and cautious biological interpretation.",
              ),''',
          )
          replace_once(
              audit,
              '("bmb830.m02", "bmb830.m06", "bmb830.m08", "bmb830.m10"),',
              '("bmb830.m02", "bmb830.m06", "bmb830.m08", "bmb830.m10", "bmb830.m11"),',
          )
          replace_once(
              audit,
              '("bmb830.m01", "bmb830.m02", "bmb830.m08", "bmb830.m10"),',
              '("bmb830.m01", "bmb830.m02", "bmb830.m08", "bmb830.m10", "bmb830.m11"),',
          )
          replace_once(
              audit,
              '''    MasterLevelCriterion(
                  "bmb830.master.05",
                  MasterCriterionKind.MULTIVARIATE_ANALYSIS,
                  "Use and interpret introductory multivariate methods such as PCA and clustering.",
                  (),
                  CoverageStatus.GAP,
                  "This is the clearest remaining gap relative to ODIN and normal master's-level expectations.",
                  "Implement scaling, PCA, distances, clustering, stability, and biological interpretation.",
              ),''',
              '''    MasterLevelCriterion(
                  "bmb830.master.05",
                  MasterCriterionKind.MULTIVARIATE_ANALYSIS,
                  "Use and interpret introductory multivariate methods such as PCA and clustering.",
                  ("bmb830.m11",),
                  CoverageStatus.COVERED,
                  "The module connects matrix orientation and preprocessing to PCA, hierarchical "
                  "clustering, sensitivity, leakage-safe use, and bounded biological interpretation.",
              ),''',
          )
          audit_text = audit.read_text(encoding="utf-8")
          audit_text = audit_text.replace(
              '("bmb830.m04", "bmb830.m05", *_REGRESSION_MODULES),',
              '("bmb830.m04", "bmb830.m05", *_REGRESSION_MODULES, "bmb830.m11"),',
          )
          audit.write_text(audit_text, encoding="utf-8")

          core = Path("tests/test_bmb830_core_modules.py")
          text = core.read_text(encoding="utf-8")
          text = text.replace(
              "test_bmb830_registers_ten_complete_modules_in_order",
              "test_bmb830_registers_eleven_complete_modules_in_order",
          )
          text = text.replace(
              '        "bmb830.m10",\n    )',
              '        "bmb830.m10",\n        "bmb830.m11",\n    )',
              1,
          )
          text = text.replace(
              '        "bmb830.m10",\n    }',
              '        "bmb830.m10",\n        "bmb830.m11",\n    }',
              1,
          )
          text = text.replace("== 10\n", "== 11\n", 1)
          text = text.replace("== 160\n", "== 176\n", 1)
          core.write_text(text, encoding="utf-8")

          lazy = Path("tests/test_bmb830_lazy_loading.py")
          text = lazy.read_text(encoding="utf-8")
          text = text.replace(
              "    MODULE_10_DIAGNOSTICS_VALIDATION,\n",
              "    MODULE_11_INTRO_MULTIVARIATE,\n",
          )
          text = text.replace("page.module_count == 10", "page.module_count == 11")
          text = text.replace("not page.has_constructed_reader(9)", "not page.has_constructed_reader(10)")
          text = text.replace('"bmb830.m10"', '"bmb830.m11"')
          text = text.replace("MODULE_10_DIAGNOSTICS_VALIDATION", "MODULE_11_INTRO_MULTIVARIATE")
          text = text.replace("not page.select_module(10)", "not page.select_module(11)")
          text = text.replace('startswith("Modeldiagnostik")', 'startswith("Introduktion")')
          lazy.write_text(text, encoding="utf-8")

          coverage_test = Path("tests/test_bmb830_official_coverage.py")
          text = coverage_test.read_text(encoding="utf-8")
          text = text.replace(
              "test_bmb830_official_audit_exposes_remaining_academic_gaps",
              "test_bmb830_official_audit_closes_multivariate_gap_but_keeps_partial_work_visible",
          )
          text = text.replace(
              'assert rows["bmb830.sdu.lo03"].requirement.status is CoverageStatus.GAP',
              'assert rows["bmb830.sdu.lo03"].requirement.status is CoverageStatus.COVERED',
          )
          text = text.replace(
              'assert rows["bmb830.sdu.ct06"].requirement.status is CoverageStatus.GAP',
              'assert rows["bmb830.sdu.ct06"].requirement.status is CoverageStatus.COVERED',
          )
          text = text.replace("assert summary.covered == 6", "assert summary.covered == 8", 1)
          text = text.replace("assert summary.gap == 2", "assert summary.gap == 0", 1)
          text = text.replace(
              "assert rows[MasterCriterionKind.MULTIVARIATE_ANALYSIS].criterion.status is CoverageStatus.GAP",
              "assert rows[MasterCriterionKind.MULTIVARIATE_ANALYSIS].criterion.status is CoverageStatus.COVERED",
          )
          text = text.replace("assert summary.covered == 2", "assert summary.covered == 3", 1)
          text = text.replace("assert summary.gap == 1", "assert summary.gap == 0", 1)
          coverage_test.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("  - 10 complete modules\n", "  - 11 complete modules\n", 1)
          text = text.replace(
              "  - residual diagnostics, heteroscedasticity, leverage, Cook's distance, sensitivity analysis, information leakage, and out-of-sample validation\n",
              "  - residual diagnostics, heteroscedasticity, leverage, Cook's distance, sensitivity analysis, information leakage, and out-of-sample validation\n"
              "  - multivariate matrices, centring, scaling, distances, PCA, scores, loadings, explained variance, hierarchical clustering, and stability analysis\n",
          )
          text = text.replace("  - 160 stable objective-bank questions\n", "  - 176 stable objective-bank questions\n")
          text = text.replace(
              "The principal remaining academic gap is introductory multivariate analysis. Realistic large biological data, structured publication appraisal, and a complete individual oral-exam rehearsal remain partial until their official or source materials are available.",
              "The public multivariate requirement is now covered by an individual introductory module. Realistic large biological data, detailed figure-building practice, structured publication appraisal, and a complete individual oral-exam rehearsal remain partial until their official or source materials are available.",
          )
          text = text.replace(
              "BMB830 contains ten complete modules covering foundations through model diagnostics and validation. The official and master-level audits deliberately keep the course incomplete until introductory multivariate analysis is implemented; realistic large biological data, publication appraisal, and full individual oral-exam rehearsal remain partial.",
              "BMB830 contains eleven complete modules covering foundations through introductory multivariate analysis. The official multivariate gap is closed, while realistic large biological data, detailed visualisation practice, publication appraisal, and full individual oral-exam rehearsal remain partial.",
          )
          readme.write_text(text, encoding="utf-8")
          PY
      - run: python -m pip install 'ruff<1,>=0.5'
      - run: ruff check --fix .
      - run: ruff format .
      - name: Commit synchronized catalog and audit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Register BMB830 multivariate module and close audit gap'
          git push origin HEAD:agent/bmb830-intro-multivariate-individual
