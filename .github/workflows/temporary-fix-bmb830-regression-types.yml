name: Temporary BMB830 Regression Type Fix

on:
  push:
    branches:
      - agent/bmb830-regression-review

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/bmb830-regression-review
          fetch-depth: 0
      - name: Apply typed localization fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/computational_biomedicine_study_hub/content/bmb830/book_grounded_regression.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from .authoring import concept, example, objective, objective_mcq, practice',
              'from .authoring import concept, example, objective, objective_mcq, practice, same',
          )
          text = text.replace(
              'replace(item, expected_output=expected_output)',
              'replace(item, expected_output=same(expected_output))',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No type fix required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/computational_biomedicine_study_hub/content/bmb830/book_grounded_regression.py
          git commit -m 'Fix localized expected output type'
          git push origin HEAD:agent/bmb830-regression-review
