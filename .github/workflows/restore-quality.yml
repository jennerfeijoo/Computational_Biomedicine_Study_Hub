name: Restore Quality Workflow

on:
  pull_request:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Restore read-only quality workflow
        run: |
          cat > .github/workflows/quality.yml <<'YAML'
          name: Quality

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.11", "3.12"]

              env:
                QT_QPA_PLATFORM: offscreen

              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Install Qt runtime libraries
                  run: sudo apt-get update && sudo apt-get install --yes libegl1

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip

                - name: Install project and development dependencies
                  run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

                - name: Lint
                  run: ruff check .

                - name: Check formatting
                  run: ruff format --check .

                - name: Type check
                  run: mypy

                - name: Test
                  run: pytest
          YAML
          rm .github/workflows/restore-quality.yml

      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Restore standard read-only quality workflow"
          git push origin HEAD:${{ github.head_ref }}
