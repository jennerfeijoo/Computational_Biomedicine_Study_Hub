name: BMB830 module 12 sync

on:
  push:
    branches:
      - agent/bmb830-individual-high-dimensional-case

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bmb830-individual-high-dimensional-case
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize module and synchronize catalog
        run: |
          cat .github/tmp/bmb830-m12/sync.part* | base64 --decode | gzip --decompress > /tmp/sync_bmb830_m12.py
          python /tmp/sync_bmb830_m12.py
      - name: Format and lint authored changes
        run: |
          python -m pip install 'ruff<1,>=0.5'
          ruff check --fix .
          ruff format .
      - name: Commit synchronized module
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add individual BMB830 high-dimensional biological case'
          git push origin HEAD
