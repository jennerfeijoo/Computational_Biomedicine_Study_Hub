name: BMB830 module 12 sync

on:
  push:
    branches:
      - agent/bmb830-individual-high-dimensional-case

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bmb830-individual-high-dimensional-case
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize authored module and tests
        run: |
          mkdir -p src/computational_biomedicine_study_hub/content/bmb830 tests
          cat .github/tmp/bmb830-m12/module.part* | base64 --decode | gzip --decompress > src/computational_biomedicine_study_hub/content/bmb830/module_12_high_dimensional_case.py
          cat .github/tmp/bmb830-m12/test.part* | base64 --decode | gzip --decompress > tests/test_bmb830_high_dimensional_case.py
          rm -rf .github/tmp/bmb830-m12
          rm -f .github/workflows/bmb830-m12-sync.yml
      - name: Format and lint authored files
        run: |
          python -m pip install 'ruff<1,>=0.5'
          ruff check --fix src/computational_biomedicine_study_hub/content/bmb830/module_12_high_dimensional_case.py tests/test_bmb830_high_dimensional_case.py
          ruff format src/computational_biomedicine_study_hub/content/bmb830/module_12_high_dimensional_case.py tests/test_bmb830_high_dimensional_case.py
      - name: Commit materialized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize BMB830 high-dimensional case files'
          git push origin HEAD
