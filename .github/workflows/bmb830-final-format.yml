name: BMB830 final format

on:
  push:
    branches:
      - agent/bmb830-diagnostics-master-audit

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bmb830-diagnostics-master-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff<1,>=0.5'
      - run: ruff format src/computational_biomedicine_study_hub/content/bmb830/official_coverage.py
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/computational_biomedicine_study_hub/content/bmb830/official_coverage.py
          git commit -m 'Apply final Ruff formatting to BMB830 audit'
          git push origin HEAD:agent/bmb830-diagnostics-master-audit
