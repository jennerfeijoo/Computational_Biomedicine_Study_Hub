name: Branch content patch

on:
  push:
    branches:
      - agent/bmb830-interactions-nonlinearity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bmb830-interactions-nonlinearity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/computational_biomedicine_study_hub/content/bmb830/module_09_interactions_nonlinearity.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'β3 es cuánto cambia esa pendiente cuando G pasa de 0 a 1.': 'β3 es la diferencia de pendientes cuando G pasa de 0 a 1.',
              'β3 is the change in that slope when G moves from 0 to 1.': 'β3 is the difference in slopes when G moves from 0 to 1.',
              'β3 er ændringen i hældningen, når G går fra 0 til 1.': 'β3 er forskellen i hældninger, når G går fra 0 til 1.',
              'comparison$`Pr(>F)`[[2]]': 'comparison[2, "Pr(>F)"]',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - run: python -m pip install 'ruff<1,>=0.5'
      - run: ruff check --fix .
      - run: ruff format .
      - name: Commit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix interaction terminology and R lab policy'
          git push origin HEAD:agent/bmb830-interactions-nonlinearity
