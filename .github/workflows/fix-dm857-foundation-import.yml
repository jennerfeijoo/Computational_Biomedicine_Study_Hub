name: Fix DM857 foundation import

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/dm857-book-grounded-foundations-02'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dm857-book-grounded-foundations-02
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.1"
      - run: >-
          ruff check --fix
          src/computational_biomedicine_study_hub/content/dm857/__init__.py
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/computational_biomedicine_study_hub/content/dm857/__init__.py
          git commit -m "Organize DM857 foundation imports"
          git push origin HEAD:agent/dm857-book-grounded-foundations-02
