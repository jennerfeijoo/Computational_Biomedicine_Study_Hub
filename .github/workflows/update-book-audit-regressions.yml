name: Update book audit regressions

on:
  push:
    branches:
      - agent/book-grounded-content-audit-01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/book-grounded-content-audit-01
      - name: Update regression contracts
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("tests/test_dm857_modules_04_06_content.py"): {
                  'assert len(runtime_module.objectives) == 8': 'assert len(runtime_module.objectives) == (9 if module_id == "dm857.m04" else 8)',
                  'assert len(runtime_module.concepts) == 8': 'assert len(runtime_module.concepts) == (9 if module_id == "dm857.m04" else 8)',
                  'assert len(runtime_module.worked_examples) == 5': 'assert len(runtime_module.worked_examples) == (6 if module_id == "dm857.m04" else 5)',
                  'assert len(runtime_module.practice_exercises) == 12': 'assert len(runtime_module.practice_exercises) == (13 if module_id == "dm857.m04" else 12)',
                  'assert len(runtime_module.assessment_items) == 14': 'assert len(runtime_module.assessment_items) == (15 if module_id == "dm857.m04" else 14)',
                  'assert len(module.objectives) == 8': 'assert len(module.objectives) == (9 if module_id == "dm857.m04" else 8)',
                  'assert len(module.concepts) == 8': 'assert len(module.concepts) == (9 if module_id == "dm857.m04" else 8)',
                  'assert len(module.worked_examples) == 5': 'assert len(module.worked_examples) == (6 if module_id == "dm857.m04" else 5)',
                  'assert len(module.practice_exercises) == 12': 'assert len(module.practice_exercises) == (13 if module_id == "dm857.m04" else 12)',
                  'assert len(module.assessment_items) == 14': 'assert len(module.assessment_items) == (15 if module_id == "dm857.m04" else 14)',
              },
              Path("tests/test_dm857_modules_07_09_content.py"): {
                  'assert len(runtime_module.objectives) == 8': 'assert len(runtime_module.objectives) == (9 if module_id == "dm857.m08" else 8)',
                  'assert len(runtime_module.concepts) == 8': 'assert len(runtime_module.concepts) == (9 if module_id == "dm857.m08" else 8)',
                  'assert len(runtime_module.worked_examples) == 5': 'assert len(runtime_module.worked_examples) == (6 if module_id == "dm857.m08" else 5)',
                  'assert len(runtime_module.practice_exercises) == 12': 'assert len(runtime_module.practice_exercises) == (13 if module_id == "dm857.m08" else 12)',
                  'assert len(runtime_module.assessment_items) == 14': 'assert len(runtime_module.assessment_items) == (15 if module_id == "dm857.m08" else 14)',
                  'assert len(module.objectives) == 8': 'assert len(module.objectives) == (9 if module_id == "dm857.m08" else 8)',
                  'assert len(module.concepts) == 8': 'assert len(module.concepts) == (9 if module_id == "dm857.m08" else 8)',
                  'assert len(module.worked_examples) == 5': 'assert len(module.worked_examples) == (6 if module_id == "dm857.m08" else 5)',
                  'assert len(module.practice_exercises) == 12': 'assert len(module.practice_exercises) == (13 if module_id == "dm857.m08" else 12)',
                  'assert len(module.assessment_items) == 14': 'assert len(module.assessment_items) == (15 if module_id == "dm857.m08" else 14)',
              },
              Path("tests/test_module_bundles.py"): {
                  'assert all(bundle.content_version == "1.0.0" for bundle in BUNDLES)': 'assert {bundle.module.module_id: bundle.content_version for bundle in BUNDLES} == {\n        **{f"dm857.m{number:02d}": "1.0.0" for number in range(1, expected_count + 1)},\n        "dm857.m04": "1.1.0",\n        "dm857.m08": "1.1.0",\n    }',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in mapping.items():
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f"missing expected text in {path}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
      - name: Format changed tests
        run: |
          python -m pip install "ruff==0.16.1"
          ruff format tests/test_dm857_modules_04_06_content.py tests/test_dm857_modules_07_09_content.py tests/test_module_bundles.py
      - name: Commit updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_dm857_modules_04_06_content.py tests/test_dm857_modules_07_09_content.py tests/test_module_bundles.py
          git commit -m "Update DM857 book-grounded regression contracts"
          git push origin HEAD:agent/book-grounded-content-audit-01
