name: Apply DM857 M11 integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/dm857-adts-review'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dm857-adts-review
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic integration edits
        shell: python
        run: |
          from pathlib import Path

          init_path = Path(
              "src/computational_biomedicine_study_hub/content/dm857/__init__.py"
          )
          text = init_path.read_text(encoding="utf-8")

          import_anchor = (
              "from .book_grounded_trees import (\n"
              "    apply_trees_book_extension,\n"
              "    update_trees_audit,\n"
              ")\n"
          )
          import_block = (
              "from .book_grounded_adts import (\n"
              "    apply_adts_book_extension,\n"
              "    update_adts_audit,\n"
              ")\n"
              + import_anchor
          )
          if "from .book_grounded_adts import" not in text:
              if import_anchor not in text:
                  raise SystemExit("DM857 ADT import anchor not found")
              text = text.replace(import_anchor, import_block, 1)

          old_audit = (
              "DM857_MODULE_SOURCE_AUDIT = update_trees_audit(\n"
              "    update_strings_mappings_audit(update_foundations_audit(_BASE_DM857_MODULE_SOURCE_AUDIT))\n"
              ")"
          )
          new_audit = (
              "DM857_MODULE_SOURCE_AUDIT = update_adts_audit(\n"
              "    update_trees_audit(\n"
              "        update_strings_mappings_audit(\n"
              "            update_foundations_audit(_BASE_DM857_MODULE_SOURCE_AUDIT)\n"
              "        )\n"
              "    )\n"
              ")"
          )
          if old_audit in text:
              text = text.replace(old_audit, new_audit, 1)
          elif new_audit not in text:
              raise SystemExit("DM857 ADT audit assignment not found")

          old_apply = ") = apply_trees_book_extension(\n"
          new_apply = (
              ") = apply_adts_book_extension(\n"
              "    apply_trees_book_extension(\n"
          )
          if old_apply in text and new_apply not in text:
              text = text.replace(old_apply, new_apply, 1)
              closing_anchor = (
                  "                    LOCALIZED_MODULE_14_TESTING_DEBUGGING_QUALITY,\n"
                  "                )\n"
                  "            )\n"
                  "        )\n"
                  "    )\n"
                  ")\n\n_LOCALIZED_MODULES"
              )
              closing_replacement = (
                  "                    LOCALIZED_MODULE_14_TESTING_DEBUGGING_QUALITY,\n"
                  "                )\n"
                  "            )\n"
                  "        )\n"
                  "    )\n"
                  ")\n"
                  ")\n\n_LOCALIZED_MODULES"
              )
              if closing_anchor not in text:
                  raise SystemExit("DM857 ADT extension closing anchor not found")
              text = text.replace(closing_anchor, closing_replacement, 1)

          version_marker = "_CONTENT_VERSIONS = (\n"
          prefix, tail = text.split(version_marker, 1)
          tuple_text, suffix = tail.split(")\n\nLOCALIZED_BUNDLES", 1)
          versions = [
              line.strip().strip(",").strip('"')
              for line in tuple_text.splitlines()
              if line.strip()
          ]
          if len(versions) != 14:
              raise SystemExit(f"expected 14 DM857 versions, found {len(versions)}")
          versions[10] = "1.1.0"
          version_lines = "".join(f'    "{version}",\n' for version in versions)
          text = (
              prefix
              + version_marker
              + version_lines
              + ")\n\nLOCALIZED_BUNDLES"
              + suffix
          )
          init_path.write_text(text, encoding="utf-8")

          content_test = Path("tests/test_dm857_modules_10_12_content.py")
          content = content_test.read_text(encoding="utf-8")
          content = content.replace(
              'module_id == "dm857.m10"',
              'module_id in {"dm857.m10", "dm857.m11"}',
          )
          content_test.write_text(content, encoding="utf-8")

          audit_test = Path("tests/test_dm857_book_grounded_extensions.py")
          audit_text = audit_test.read_text(encoding="utf-8")
          reviewed_anchor = '    "dm857.m10",\n'
          reviewed_insert = reviewed_anchor + '    "dm857.m11",\n'
          if '    "dm857.m11",\n' not in audit_text:
              if reviewed_anchor not in audit_text:
                  raise SystemExit("reviewed-module anchor not found")
              audit_text = audit_text.replace(reviewed_anchor, reviewed_insert, 1)
          audit_test.write_text(audit_text, encoding="utf-8")

          bundle_test = Path("tests/test_module_bundles.py")
          bundle_text = bundle_test.read_text(encoding="utf-8")
          version_anchor = '        "dm857.m10": "1.1.0",\n'
          version_insert = version_anchor + '        "dm857.m11": "1.1.0",\n'
          if '        "dm857.m11": "1.1.0",\n' not in bundle_text:
              if version_anchor not in bundle_text:
                  raise SystemExit("bundle-version anchor not found")
              bundle_text = bundle_text.replace(version_anchor, version_insert, 1)
          bundle_test.write_text(bundle_text, encoding="utf-8")
      - name: Format edited Python files
        run: |
          python -m pip install "ruff==0.16.1"
          ruff check --fix \
            src/computational_biomedicine_study_hub/content/dm857/__init__.py \
            src/computational_biomedicine_study_hub/content/dm857/book_grounded_adts.py \
            tests/test_dm857_adts_review.py \
            tests/test_dm857_book_grounded_extensions.py \
            tests/test_dm857_modules_10_12_content.py \
            tests/test_module_bundles.py
          ruff format \
            src/computational_biomedicine_study_hub/content/dm857/__init__.py \
            src/computational_biomedicine_study_hub/content/dm857/book_grounded_adts.py \
            tests/test_dm857_adts_review.py \
            tests/test_dm857_book_grounded_extensions.py \
            tests/test_dm857_modules_10_12_content.py \
            tests/test_module_bundles.py
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/computational_biomedicine_study_hub/content/dm857/__init__.py \
            src/computational_biomedicine_study_hub/content/dm857/book_grounded_adts.py \
            tests/test_dm857_adts_review.py \
            tests/test_dm857_book_grounded_extensions.py \
            tests/test_dm857_modules_10_12_content.py \
            tests/test_module_bundles.py
          git commit -m "Integrate DM857 M11 source review"
          git push origin HEAD:agent/dm857-adts-review
