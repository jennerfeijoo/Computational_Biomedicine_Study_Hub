name: Branch audit patch

on:
  push:
    branches:
      - agent/bmb830-diagnostics-master-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bmb830-diagnostics-master-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audit corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "src/computational_biomedicine_study_hub/content/bmb830/official_coverage.py"
          )
          text = path.read_text(encoding="utf-8")

          old_visualisation = '''    OfficialRequirement(
              "bmb830.sdu.lo04",
              OfficialRequirementKind.LEARNING_OUTCOME,
              "Design scripts for detailed visualisation of results.",
              ("bmb830.m01", "bmb830.m02", "bmb830.m07", "bmb830.m09", "bmb830.m10"),
              CoverageStatus.COVERED,
              "The authored modules connect reproducible scripts to distribution, association, interaction, "
              "prediction, and diagnostic visualisation decisions, with practice and assessment evidence.",
          ),'''
          new_visualisation = '''    OfficialRequirement(
              "bmb830.sdu.lo04",
              OfficialRequirementKind.LEARNING_OUTCOME,
              "Design scripts for detailed visualisation of results.",
              ("bmb830.m01", "bmb830.m02", "bmb830.m07", "bmb830.m09", "bmb830.m10"),
              CoverageStatus.PARTIAL,
              "The authored modules connect reproducible scripts to distribution, association, interaction, "
              "prediction, and diagnostic visualisation decisions, but do not yet provide a complete "
              "individual laboratory for constructing and refining detailed statistical figures.",
              "Add individually executable figure-building exercises with layered statistical graphics, "
              "diagnostic annotations, and interpretation independent of cosmetic styling.",
          ),'''

          old_referenced = '''    known = set(_ALL_MODULE_IDS)
          referenced = {
              module_id
              for row in (*official_rows, *master_rows)
              for module_id in (
                  row.requirement.module_ids
                  if isinstance(row, OfficialCoverageRow)
                  else row.criterion.module_ids
              )
          }
          unknown = referenced - known'''
          new_referenced = '''    known = set(_ALL_MODULE_IDS)
          referenced_official = {
              module_id
              for row in official_rows
              for module_id in row.requirement.module_ids
          }
          referenced_master = {
              module_id
              for row in master_rows
              for module_id in row.criterion.module_ids
          }
          referenced = referenced_official | referenced_master
          unknown = referenced - known'''

          replacements = (
              (old_visualisation, new_visualisation),
              (old_referenced, new_referenced),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit("Expected audit block was not found")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY
      - run: python -m pip install 'ruff<1,>=0.5'
      - run: ruff check --fix .
      - run: ruff format .
      - name: Commit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct BMB830 audit typing and visualisation status'
          git push origin HEAD:agent/bmb830-diagnostics-master-audit
