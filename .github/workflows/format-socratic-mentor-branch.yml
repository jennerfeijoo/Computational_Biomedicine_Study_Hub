name: Format Socratic mentor branch

on:
  push:
    branches:
      - feature/socratic-ollama-mentor

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/socratic-ollama-mentor

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Format mentor sources
        run: |
          python -m pip install 'ruff==0.16.1'
          ruff format \
            src/computational_biomedicine_study_hub/learning/mentor.py \
            src/computational_biomedicine_study_hub/learning/mentor_context.py \
            src/computational_biomedicine_study_hub/ui/widgets/floating_tutor_chat.py

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/computational_biomedicine_study_hub/learning/mentor.py \
            src/computational_biomedicine_study_hub/learning/mentor_context.py \
            src/computational_biomedicine_study_hub/ui/widgets/floating_tutor_chat.py
          git commit -m 'Apply Ruff formatting to Socratic mentor sources'
          git push origin HEAD:feature/socratic-ollama-mentor
