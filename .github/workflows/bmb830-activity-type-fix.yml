name: BMB830 activity type fix

on:
  push:
    branches:
      - agent/bmb830-intro-multivariate-individual

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bmb830-intro-multivariate-individual
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace unsupported activity type
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "src/computational_biomedicine_study_hub/content/bmb830/module_11_intro_multivariate.py"
          )
          text = path.read_text(encoding="utf-8")
          marker = '"METHOD_SELECTION"'
          count = text.count(marker)
          if count != 2:
              raise SystemExit(f"Expected two METHOD_SELECTION entries, found {count}")
          path.write_text(
              text.replace(marker, '"DATA_INTERPRETATION"'),
              encoding="utf-8",
          )
          PY
      - run: python -m pip install 'ruff<1,>=0.5'
      - run: ruff check --fix .
      - run: ruff format .
      - name: Commit activity-type correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use supported activity types in BMB830 multivariate practice'
          git push origin HEAD:agent/bmb830-intro-multivariate-individual
