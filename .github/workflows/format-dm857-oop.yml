name: Format DM857 OOP review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/dm857-oop-review'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dm857-oop-review
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format changed Python files
        run: |
          python -m pip install "ruff==0.16.1"
          ruff format \
            src/computational_biomedicine_study_hub/content/dm857/__init__.py \
            src/computational_biomedicine_study_hub/content/dm857/book_grounded_oop.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/computational_biomedicine_study_hub/content/dm857/__init__.py \
            src/computational_biomedicine_study_hub/content/dm857/book_grounded_oop.py
          git commit -m "Format DM857 M12 source review"
          git push origin HEAD:agent/dm857-oop-review
