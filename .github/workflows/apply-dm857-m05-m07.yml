name: Apply DM857 M05 M07 integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/dm857-strings-mappings-review'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dm857-strings-mappings-review
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic integration edits
        shell: python
        run: |
          from pathlib import Path

          init_path = Path(
              "src/computational_biomedicine_study_hub/content/dm857/__init__.py"
          )
          text = init_path.read_text(encoding="utf-8")
          import_anchor = (
              "from .book_grounded_foundations import (\n"
              "    apply_foundations_book_extensions,\n"
              "    update_foundations_audit,\n"
              ")\n"
          )
          import_block = import_anchor + (
              "from .book_grounded_strings_mappings import (\n"
              "    apply_strings_mappings_book_extensions,\n"
              "    update_strings_mappings_audit,\n"
              ")\n"
          )
          if "from .book_grounded_strings_mappings import" not in text:
              if import_anchor not in text:
                  raise SystemExit("DM857 import anchor not found")
              text = text.replace(import_anchor, import_block, 1)

          old_audit = (
              "DM857_MODULE_SOURCE_AUDIT = update_foundations_audit("
              "_BASE_DM857_MODULE_SOURCE_AUDIT)"
          )
          new_audit = (
              "DM857_MODULE_SOURCE_AUDIT = update_strings_mappings_audit(\n"
              "    update_foundations_audit(_BASE_DM857_MODULE_SOURCE_AUDIT)\n"
              ")"
          )
          if old_audit in text:
              text = text.replace(old_audit, new_audit, 1)
          elif new_audit not in text:
              raise SystemExit("DM857 audit assignment not found")

          old_apply = ") = apply_foundations_book_extensions(\n"
          new_apply = (
              ") = apply_strings_mappings_book_extensions(\n"
              "    apply_foundations_book_extensions(\n"
          )
          if old_apply in text and new_apply not in text:
              text = text.replace(old_apply, new_apply, 1)
              closing_anchor = (
                  "            LOCALIZED_MODULE_14_TESTING_DEBUGGING_QUALITY,\n"
                  "        )\n"
                  "    )\n"
                  ")\n\n_LOCALIZED_MODULES"
              )
              closing_replacement = (
                  "            LOCALIZED_MODULE_14_TESTING_DEBUGGING_QUALITY,\n"
                  "        )\n"
                  "    )\n"
                  ")\n"
                  ")\n\n_LOCALIZED_MODULES"
              )
              if closing_anchor not in text:
                  raise SystemExit("DM857 extension closing anchor not found")
              text = text.replace(closing_anchor, closing_replacement, 1)

          version_marker = "_CONTENT_VERSIONS = (\n"
          prefix, tail = text.split(version_marker, 1)
          tuple_text, suffix = tail.split(")\n\nLOCALIZED_BUNDLES", 1)
          versions = [
              line.strip().strip(',').strip('"')
              for line in tuple_text.splitlines()
              if line.strip()
          ]
          if len(versions) != 14:
              raise SystemExit(f"expected 14 DM857 versions, found {len(versions)}")
          versions[4] = "1.1.0"
          versions[6] = "1.1.0"
          version_lines = "".join(f'    "{version}",\n' for version in versions)
          text = (
              prefix
              + version_marker
              + version_lines
              + ")\n\nLOCALIZED_BUNDLES"
              + suffix
          )
          init_path.write_text(text, encoding="utf-8")

          replacements = {
              Path("tests/test_dm857_modules_04_06_content.py"): {
                  '(9 if module_id == "dm857.m04" else 8)': (
                      '(9 if module_id in {"dm857.m04", "dm857.m05"} else 8)'
                  ),
                  '(6 if module_id == "dm857.m04" else 5)': (
                      '(6 if module_id in {"dm857.m04", "dm857.m05"} else 5)'
                  ),
                  '(13 if module_id == "dm857.m04" else 12)': (
                      '(13 if module_id in {"dm857.m04", "dm857.m05"} else 12)'
                  ),
                  '(15 if module_id == "dm857.m04" else 14)': (
                      '(15 if module_id in {"dm857.m04", "dm857.m05"} else 14)'
                  ),
              },
              Path("tests/test_dm857_modules_07_09_content.py"): {
                  '(9 if module_id == "dm857.m08" else 8)': (
                      '(9 if module_id in {"dm857.m07", "dm857.m08"} else 8)'
                  ),
                  '(6 if module_id == "dm857.m08" else 5)': (
                      '(6 if module_id in {"dm857.m07", "dm857.m08"} else 5)'
                  ),
                  '(13 if module_id == "dm857.m08" else 12)': (
                      '(13 if module_id in {"dm857.m07", "dm857.m08"} else 12)'
                  ),
                  '(15 if module_id == "dm857.m08" else 14)': (
                      '(15 if module_id in {"dm857.m07", "dm857.m08"} else 14)'
                  ),
              },
              Path("tests/test_dm857_book_grounded_extensions.py"): {
                  '        "dm857.m04",\n': (
                      '        "dm857.m04",\n'
                      '        "dm857.m05",\n'
                  ),
                  '        "dm857.m06",\n': (
                      '        "dm857.m06",\n'
                      '        "dm857.m07",\n'
                  ),
                  '        "dm857.m04",\n        "dm857.m06",\n': (
                      '        "dm857.m04",\n'
                      '        "dm857.m05",\n'
                      '        "dm857.m06",\n'
                      '        "dm857.m07",\n'
                  ),
              },
              Path("tests/test_module_bundles.py"): {
                  '        "dm857.m04": "1.1.0",\n': (
                      '        "dm857.m04": "1.1.0",\n'
                      '        "dm857.m05": "1.1.0",\n'
                  ),
                  '        "dm857.m08": "1.1.0",\n': (
                      '        "dm857.m07": "1.1.0",\n'
                      '        "dm857.m08": "1.1.0",\n'
                  ),
              },
          }

          for path, mapping in replacements.items():
              file_text = path.read_text(encoding="utf-8")
              for old, new in mapping.items():
                  if old in file_text:
                      file_text = file_text.replace(old, new)
              path.write_text(file_text, encoding="utf-8")
      - name: Format edited Python files
        run: |
          python -m pip install "ruff==0.16.1"
          ruff check --fix \
            src/computational_biomedicine_study_hub/content/dm857/__init__.py \
            src/computational_biomedicine_study_hub/content/dm857/book_grounded_strings_mappings.py \
            tests/test_dm857_modules_04_06_content.py \
            tests/test_dm857_modules_07_09_content.py \
            tests/test_dm857_book_grounded_extensions.py \
            tests/test_module_bundles.py
          ruff format \
            src/computational_biomedicine_study_hub/content/dm857/__init__.py \
            src/computational_biomedicine_study_hub/content/dm857/book_grounded_strings_mappings.py \
            tests/test_dm857_modules_04_06_content.py \
            tests/test_dm857_modules_07_09_content.py \
            tests/test_dm857_book_grounded_extensions.py \
            tests/test_module_bundles.py
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/computational_biomedicine_study_hub/content/dm857/__init__.py \
            src/computational_biomedicine_study_hub/content/dm857/book_grounded_strings_mappings.py \
            tests/test_dm857_modules_04_06_content.py \
            tests/test_dm857_modules_07_09_content.py \
            tests/test_dm857_book_grounded_extensions.py \
            tests/test_module_bundles.py
          git commit -m "Integrate DM857 M05 and M07 source review"
          git push origin HEAD:agent/dm857-strings-mappings-review
